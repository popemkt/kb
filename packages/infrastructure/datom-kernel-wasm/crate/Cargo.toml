[package]
name = "datom_kernel"
version = "0.0.0"
edition = "2024"
publish = false
description = "EXPERIMENT: kb's datom kernel in Rust, compiled to WebAssembly (docs/research/2026-10-31-rust-wasm-in-kb.md)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Must equal the wasm-bindgen-cli nix provides (flake.lock's nixpkgs): the
# CLI refuses a module built against any other version.
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
