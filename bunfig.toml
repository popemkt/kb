# Supply chain. `minimumReleaseAge` is 3 days in minutes: a version published
# minutes ago cannot enter the lockfile, which is the cheap half of the
# defence against a compromised publish. `trustedDependencies` is the other
# half — an explicit allowlist of packages permitted to run install lifecycle
# scripts. Empty means: nothing runs code at install time.
[install]
minimumReleaseAge = 4320
trustedDependencies = []

# One workspace, two runners, split by package rather than by file: every
# package but the browser ones runs on `bun test packages`; the browser
# packages (@kb/ui, the kit, the families' -ui halves and the UI test kit) run on Vitest (`bun run test:ui`) because their
# suites need happy-dom, vi.mock hoisting and fake timers. Documented once in
# DESIGN.md; harness/tests/browser-scope.test.ts holds this list to the
# packages' scope tags.
[test]
# A test's time budget is the `test` script's --timeout (bun reads no budget
# from here). Bun's 5 s default is a dev Mac's measure: CI's macOS runner
# takes the suite's heaviest cases far longer (the 2000-run forest merge
# property, 0.12 s on a dev Mac, ran 4.8 s and 5.5 s there, the second a
# timeout), so the default made them flake. A hang still fails, later.
pathIgnorePatterns = ["**/packages/app/ui/**", "**/packages/kit/**", "**/packages/extension/*-ui/**", "**/packages/test-support/ui-test-kit/**"]
# What a run preloads is one list, packages/app/test-kit/src/preload.ts: the
# fast-check seed (inert unless KB_FAST_CHECK_SEED is set; the mutation run
# sets it) and the test home, which gives every run a scratch home store and
# every test its own data, so a test never registers a location in the
# person's home or shares trust with another test. Why, in each file. Each
# `bun test` package's own bunfig.toml names the same module, so a suite run
# from its package directory gets it too.
preload = ["./packages/app/test-kit/src/preload.ts"]
