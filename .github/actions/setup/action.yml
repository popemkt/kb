name: Set up the toolchain
description: >-
  Nix with the flake's dev shell and, unless turned off, the workspace's
  dependencies. With `flake-store`, the Nix store `nix flake check` builds is
  restored from, and saved to, the Actions cache. The one setup every
  validation and release job shares.

inputs:
  flake-store:
    description: >-
      Restore the Nix store snapshot of `nix flake check`, and save it when its
      key missed. For the job that runs the flake check, one per platform.
    default: "false"
  install:
    description: Run `bun install --frozen-lockfile`.
    default: "true"

# Bun cache restore measured 12.5s plus 3.7s install, versus 10.3s without
# the cache (and 14s to save). Keep downloads uncached. Dev-shell snapshots
# measured 67s to restore versus 45s to substitute from cache.nixos.org.
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    # The key is the flake (nixpkgs, the dev shell) and the bun2nix inputs. A
    # missed key restores the newest snapshot of the same flake.lock, so a
    # bun.lock change builds only its new packages; a nixpkgs bump starts
    # from empty, which is also what keeps the snapshot from carrying every
    # old nixpkgs forward. No secret: the repository's Actions cache (10 GB,
    # least recently used evicted first). A pull request reads main's
    # snapshot and saves its own only when it changed what the key hashes.
    - name: Restore the Nix store
      if: inputs.flake-store == 'true'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-flake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}-${{ hashFiles('bun.nix', 'nix/**') }}
        restore-prefixes-first-match: nix-flake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: nix develop -c bash -e {0}
      run: bun install --frozen-lockfile
