name: release

# A pushed v<version> tag publishes that version as a GitHub Release; a manual
# run is the dry run, which builds and smoke-tests the same bundle and
# publishes nothing. The tag must equal package.json's version. The build,
# smoke test, provenance and release are publish.yml's, the one release path.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # package.json's version is the one source; a tag that disagrees with it
      # would publish one version under another's name.
      - name: Read version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.prepare.outputs.version }}
      publish: ${{ github.event_name == 'push' }}
