name: Validate

# One question, "is the repo green", answered by independent jobs that run in
# parallel because they share nothing but setup (.github/actions/setup). The
# run's conclusion is the answer; bin/validate-green reads that, never a job
# name. Why the jobs are cut where they are is docs/ci.md.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          runtime=true
          if [ "$EVENT" = pull_request ]; then
            # Only prose is exempt. Data, assets, workflows, toolchain and all
            # packages can affect runtime and keep every suite selected.
            changed=$(git diff --name-only "$BASE" "$HEAD")
            if ! printf '%s\n' "$changed" | grep -qvE '^(docs/.*\.md|README\.md)$'; then
              runtime=false
            fi
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

  # The flake: formatting, the hook and scripts, the workflows, and the
  # package build itself (`checks.kb`), on each platform a release ships for.
  nix:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The snapshot holds the ~3,700 bun2nix package derivations `checks.kb`
      # depends on; restored, only kb itself builds.
      - name: Set up
        uses: ./.github/actions/setup
        with:
          flake-store: true
          install: false
      - name: Lint the hook, scripts and workflows
        run: |
          shellcheck .githooks/pre-commit bin/*
          actionlint
          git ls-files -z '*.nix' | xargs -0 nixfmt --check

      - name: Build flake checks
        run: nix flake check -L

  # The toolchain gate. ubuntu, unlike the suites below: it is static analysis
  # (types, lint, format, the harness, the audits), the pre-commit hook already
  # runs exactly this on Linux checkouts for every commit, and it keeps
  # Validate inside the five macOS jobs an account may run at once.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Every step runs inside the flake's dev shell, so Bun is the one the
    # pre-commit hook and `packages.kb` use, not whatever setup-bun calls
    # latest.
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The warn ratchet counts from the fork point with main
          # (harness/src/snapshot.ts, baselineAtRatchetBase); a shallow clone
          # has no history to find it in.
          fetch-depth: 0
      - name: Set up
        uses: ./.github/actions/setup

      # `verify` is the one name for the toolchain gate; what it runs is its
      # definition in package.json, stated nowhere else. Invoked with bun, not
      # npm: the workspace root declares devEngines npm 12 and `npm run` fails
      # EBADDEVENGINES on the runner.
      - name: Verify
        run: bun run verify

      - name: Generated docs match .kb data
        run: bun packages/app/cli/src/main.ts docs check

  # Core has no browser/GPU requirement. Linux frees a macOS slot for render.
  core:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up
        uses: ./.github/actions/setup

      - name: Core suite
        run: bun run test

      # Wider than the committed seeds that `bun test` already runs. Cheap
      # (pure, in-memory histories) and the only thing that exercises replay
      # determinism across seeds nobody has looked at.
      - name: Deterministic simulation sweep
        run: bun run test:dst

  # Sharded across runners, not parallelised on one: Vitest already forks a
  # worker per core inside each package, and the suite has gone red under load
  # before (its timing gaps), so every runner keeps the one-package-at-a-time
  # load `test:ui` gives it and runs half of each package's files. A shard can
  # hold none of a small package's files, which is not a failure.
  ui:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up
        uses: ./.github/actions/setup

      - name: UI suite
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run test:ui --shard="$SHARD" --passWithNoTests

  # Two isolated runners split files without increasing per-runner load.
  render:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up
        uses: ./.github/actions/setup

      - name: Cache Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium for the render suite
        run: bunx playwright install chromium
        working-directory: packages/test-support/render-tests

      - name: Render suite
        run: bun run test:render --shard=${{ matrix.shard }}
