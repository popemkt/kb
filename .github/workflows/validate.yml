name: Validate

# One question, "is the repo green", answered by independent jobs that run in
# parallel because they share nothing but setup (.github/actions/setup). The
# run's conclusion is the answer; bin/validate-green reads that, never a job
# name. Why the jobs are cut where they are is docs/ci.md.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ "$EVENT" = pull_request ]; then
            bin/ci-scope "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            bin/ci-scope >> "$GITHUB_OUTPUT"
          fi

  # The flake: formatting, the hook and scripts, the workflows, and the
  # package build itself (`checks.kb`), on each platform a release ships for.
  nix:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # On Linux the snapshot holds the ~3,700 bun2nix package derivations
      # `checks.kb` depends on; restored, only kb itself builds. macOS has
      # none: extracting the 1.5 GB snapshot took 170 s there, as long as
      # substituting the packages from cache.nixos.org and building the rest
      # (docs/ci.md, Scheduling and selection).
      - name: Set up
        uses: ./.github/actions/setup
        with:
          flake-store: ${{ runner.os == 'Linux' }}
          install: false
      - name: Lint the hook, scripts and workflows
        run: |
          shellcheck .githooks/pre-commit bin/*
          actionlint
          git ls-files -z '*.nix' | xargs -0 nixfmt --check

      - name: Build flake checks
        run: nix flake check -L

  # The toolchain gate. ubuntu, unlike the suites below: it is static analysis
  # (types, lint, format, the harness, the audits), the pre-commit hook already
  # runs exactly this on Linux checkouts for every commit, and it keeps
  # Validate inside the five macOS jobs an account may run at once.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Every step runs inside the flake's dev shell, so Bun is the one the
    # pre-commit hook and `packages.kb` use, not whatever setup-bun calls
    # latest.
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The warn ratchet counts from the fork point with main
          # (harness/src/snapshot.ts, baselineAtRatchetBase); a shallow clone
          # has no history to find it in.
          fetch-depth: 0
      - name: Set up
        uses: ./.github/actions/setup

      # `verify` is the one name for the toolchain gate; what it runs is its
      # definition in package.json, stated nowhere else. Invoked with bun, not
      # npm: the workspace root declares devEngines npm 12 and `npm run` fails
      # EBADDEVENGINES on the runner.
      - name: Verify
        run: bun run verify

      - name: Generated docs match .kb data
        run: bin/kb docs check

  # Core has no browser/GPU requirement. Linux frees a macOS slot for render.
  core:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up
        uses: ./.github/actions/setup

      - name: Core suite
        run: bun run test

      # Wider than the committed seeds that `bun test` already runs. Cheap
      # (pure, in-memory histories) and the only thing that exercises replay
      # determinism across seeds nobody has looked at.
      - name: Deterministic simulation sweep
        run: bun run test:dst

  # Sharded across runners, not parallelised on one: Vitest already forks a
  # worker per core inside each package, and the suite has gone red under load
  # before (its timing gaps), so every runner keeps the one-package-at-a-time
  # load `test:ui` gives it and runs half of each package's files. A shard can
  # hold none of a small package's files, which is not a failure.
  ui:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up
        uses: ./.github/actions/setup

      - name: UI suite
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run test:ui --shard="$SHARD" --passWithNoTests

  # The macos project (the GPU, macOS's fonts and scrollbars) on two macOS
  # runners, the portable one on two Ubuntu runners; which spec is which is
  # `MACOS_SPECS` in the render config. Linux runners never queue behind the
  # account's five macOS slots. Shard selection is in the render config.
  render:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, project: macos, shard: 1/2 }
          - { runner: macos-15, project: macos, shard: 2/2 }
          - { runner: ubuntu-24.04, project: portable, shard: 1/2 }
          - { runner: ubuntu-24.04, project: portable, shard: 2/2 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up
        uses: ./.github/actions/setup

      - name: Cache Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      # --with-deps installs Chromium's system libraries on Linux; macOS has
      # none to add.
      - name: Install Chromium for the render suite
        run: bunx playwright install --with-deps chromium
        working-directory: packages/test-support/render-tests

      - name: Render suite
        env:
          PROJECT: ${{ matrix.project }}
          KB_RENDER_SHARD: ${{ matrix.shard }}
          KB_RENDER_TIMING: "1"
        run: bun run test:render --project="$PROJECT"

  # The Android app (apps/android), a Gradle project the workspace does not
  # see: its JVM unit tests, then the debug APK, in the flake's android dev
  # shell, so the JDK, Gradle and SDK are the ones a person builds with.
  # Linux only; the shell also exists for aarch64-darwin, but the build is
  # the same and a macOS slot is the account's scarce resource.
  android:
    needs: scope
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop .#android -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          install: false

      - name: Unit tests and the debug APK
        run: gradle -p apps/android --no-daemon testDebugUnitTest assembleDebug

      - name: Keep the test report of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-report
          path: apps/android/app/build/reports/tests/
          if-no-files-found: ignore

  validate:
    if: always()
    needs: [scope, verify, nix, core, ui, render, android]
    runs-on: ubuntu-24.04
    steps:
      # A gate is skipped only by its `if`, which reads the scope's answer
      # for it (bin/ci-scope), so once scope has passed a skip on a PR means
      # the change did not select that gate. A push selects every gate, so
      # there a skip is a failure.
      - name: All selected gates passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .scope.result == "success" and
            (del(.scope) | all(.result == "success" or
              (.result == "skipped" and $pr)))
          ' --argjson pr '${{ github.event_name == 'pull_request' }}'
