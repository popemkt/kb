# Every version the Android app builds with, named once. The SDK levels the
# app compiles against live in app/build.gradle.kts beside the toolchain
# they must match (`nix/android-shell.nix`).
[versions]
agp = "8.13.0"
kotlin = "2.2.20"
# Capacitor's Android runtime, from Maven: the shell needs no npm package or CLI (README.md → Build).
capacitor = "8.6.2"
androidxCore = "1.17.0"
appcompat = "1.7.1"
activity = "1.11.0"
lifecycle = "2.9.3"
work = "2.10.4"
serialization = "1.9.0"
coroutines = "1.10.2"
junit = "4.13.2"
# Runs the shell activity on the JVM, Capacitor included, for ShellActivityTest.
robolectric = "4.16"

[libraries]
capacitor-core = { group = "com.capacitorjs", name = "core", version.ref = "capacitor" }
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
